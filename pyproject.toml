[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mong-nhiem"
version = "0.2.0"
description = "Authoritative cognitive governance kernel for real-time cyber-physical interaction"
authors = [
    {name = "AnhDucwcs"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema>=4.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mong_nhiem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["research"]
